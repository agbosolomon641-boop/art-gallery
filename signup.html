<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ArtSpace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎨 ArtSpace</h1>
</header>

<main>

  <div class="hero">

    <h2>Create Account</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <br><br>

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <br><br>

    <button onclick="createAccount()">
      Create Account
    </button>

    <p id="message"></p>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://qpbimhiaxpeawuazvori.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M7nFBDP8VYJODeTweCfWhQ_50atMXO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function createAccount() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if (!email || !password) {
    message.textContent =
      "Enter your email and password.";
    return;
  }

  const { error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if (error) {

    message.textContent =
      error.message;

  } else {

    message.textContent =
      "Account created successfully!";

  }
}

</script>

</body>
</html>
